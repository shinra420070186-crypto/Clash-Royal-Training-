<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clash Royale Tracker Trainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lilita One', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0f172a;
    }
    .cr-text-stroke {
      -webkit-text-stroke: 1.5px #000;
      text-shadow: 2px 2px 0px #000;
    }
    .arena-bg {
      background: linear-gradient(180deg, #43a047 0%, #2e7d32 100%);
      border: 4px solid #1b5e20;
    }
    .card-drop-anim {
      animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dropIn {
      0% { transform: scale(1.5) translateY(-20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .elixir-bar-fill {
      background: linear-gradient(180deg, #ff4081 0%, #c2185b 100%);
      box-shadow: 0 0 10px #e91e63;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 text-white">

  <!-- Main Phone Interface -->
  <div class="w-full max-w-md h-[720px] bg-slate-900 rounded-3xl border-4 border-slate-700 overflow-hidden flex flex-col justify-between p-4 relative shadow-2xl">
    
    <!-- Top Mode Switches -->
    <div class="flex justify-between items-center bg-slate-800 p-2 rounded-xl border-2 border-slate-700 z-10">
      <button id="btn-mode-elixir" onclick="setMode('elixir')" class="px-3 py-1.5 bg-yellow-500 text-black rounded-lg text-sm font-bold shadow-md w-1/2 mr-1">Elixir Tracker</button>
      <button id="btn-mode-card" onclick="setMode('card')" class="px-3 py-1.5 bg-slate-700 text-white rounded-lg text-sm font-bold shadow-md w-1/2 ml-1">Card Cycle</button>
    </div>

    <!-- Arena / Bot Play Area -->
    <div class="arena-bg w-full h-72 rounded-2xl relative flex flex-col items-center justify-center p-3 overflow-hidden shadow-inner mt-4 mb-4">
      <div id="status-badge" class="absolute top-3 bg-black/70 px-4 py-1.5 rounded-full text-xs text-yellow-400 tracking-wider font-bold z-10 border border-yellow-600">PREPARING MATCH...</div>
      
      <!-- Card Image Slot -->
      <div id="played-card-slot" class="relative w-24 h-32 hidden card-drop-anim flex flex-col items-center justify-center">
        <!-- The dynamic image pulled from your GitHub folder -->
        <img id="played-card-icon" src="" alt="Card" class="w-full h-full object-contain drop-shadow-2xl" />
        
        <!-- Elixir Cost Badge -->
        <div id="played-card-cost" class="absolute -top-3 -left-3 bg-pink-600 border-2 border-black text-white text-sm px-2.5 py-0.5 rounded-full font-bold shadow-lg z-10">
          2
        </div>
      </div>

      <!-- Feedback Overlay -->
      <div id="feedback-overlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center gap-4 hidden z-20">
        <div id="feedback-text" class="text-4xl cr-text-stroke tracking-wide">CORRECT!</div>
        <button onclick="startTrainer()" class="px-8 py-3 bg-blue-500 hover:bg-blue-400 text-white rounded-xl text-xl font-bold shadow-lg border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition-all">Next Drill</button>
      </div>
    </div>

    <!-- Question & Options Panel -->
    <div id="question-panel" class="w-full bg-slate-800 p-4 rounded-2xl border-2 border-slate-700 flex flex-col items-center gap-3">
      <div id="question-title" class="text-sm text-gray-300 text-center uppercase tracking-wide font-bold">Watch the arena...</div>
      
      <!-- Interactive Grid injected by JavaScript -->
      <div id="options-grid" class="grid grid-cols-2 gap-3 w-full hidden"></div>
    </div>

    <!-- Smooth Elixir Bar -->
    <div id="elixir-container" class="w-full bg-slate-950 p-3 rounded-xl border-2 border-pink-900 flex flex-col gap-1 mt-4">
      <div class="flex justify-between text-xs px-1 text-pink-300 font-bold tracking-wide">
        <span>OPPONENT ELIXIR</span>
      </div>
      <div class="w-full bg-gray-900 h-5 rounded-full overflow-hidden border-2 border-slate-700 p-0.5 relative">
        <!-- Ticking bar -->
        <div id="elixir-bar" class="h-full elixir-bar-fill rounded-full" style="width: 100%;"></div>
      </div>
    </div>

  </div>

  <script>
    // Master Card Database matching the filenames required
    const CARDS = [
      { id: 'skeletons', name: 'Skeletons', cost: 1 },
      { id: 'ice-spirit', name: 'Ice Spirit', cost: 1 },
      { id: 'zap', name: 'Zap', cost: 2 },
      { id: 'log', name: 'The Log', cost: 2 },
      { id: 'archers', name: 'Archers', cost: 3 },
      { id: 'knight', name: 'Knight', cost: 3 },
      { id: 'arrows', name: 'Arrows', cost: 3 },
      { id: 'miner', name: 'Miner', cost: 3 },
      { id: 'hog-rider', name: 'Hog Rider', cost: 4 },
      { id: 'fireball', name: 'Fireball', cost: 4 },
      { id: 'musketeer', name: 'Musketeer', cost: 4 },
      { id: 'valkyrie', name: 'Valkyrie', cost: 4 },
      { id: 'poison', name: 'Poison', cost: 4 },
      { id: 'baby-dragon', name: 'Baby Dragon', cost: 4 },
      { id: 'giant', name: 'Giant', cost: 5 },
      { id: 'pekka', name: 'P.E.K.K.A', cost: 7 },
      { id: 'golem', name: 'Golem', cost: 8 }
    ];

    let currentMode = 'elixir';
    let currentElixir = 10;
    let targetStopPlays = 0;
    let playsCount = 0;
    let elixirTimer = null;
    let botLoopTimer = null;
    let deck = [];
    let hand = [];
    let queue = [];
    let correctAns = null;

    function setMode(mode) {
      currentMode = mode;
      
      const elxBtn = document.getElementById('btn-mode-elixir');
      const crdBtn = document.getElementById('btn-mode-card');
      
      elxBtn.className = mode === 'elixir' ? 'px-3 py-1.5 bg-yellow-500 text-black rounded-lg text-sm font-bold shadow-md w-1/2 mr-1' : 'px-3 py-1.5 bg-slate-700 text-white rounded-lg text-sm font-bold shadow-md w-1/2 mr-1';
      crdBtn.className = mode === 'card' ? 'px-3 py-1.5 bg-yellow-500 text-black rounded-lg text-sm font-bold shadow-md w-1/2 ml-1' : 'px-3 py-1.5 bg-slate-700 text-white rounded-lg text-sm font-bold shadow-md w-1/2 ml-1';
      
      document.getElementById('elixir-container').style.display = mode === 'elixir' ? 'flex' : 'none';
      startTrainer();
    }

    function startTrainer() {
      clearInterval(elixirTimer);
      clearTimeout(botLoopTimer);
      
      document.getElementById('feedback-overlay').classList.add('hidden');
      document.getElementById('options-grid').classList.add('hidden');
      document.getElementById('played-card-slot').classList.add('hidden');
      document.getElementById('status-badge').innerText = "TRACKING...";
      document.getElementById('question-title').innerText = currentMode === 'elixir' ? "Tracking Elixir..." : "Tracking Card Cycle...";

      // Build random 8-card deck
      deck = [...CARDS].sort(() => 0.5 - Math.random()).slice(0, 8);
      hand = deck.slice(0, 4);
      queue = deck.slice(4, 8);

      if (currentMode === 'elixir') {
        initElixirTrainer();
      } else {
        initCardCycleTrainer();
      }
    }

    // --- ELIXIR LOGIC ---
    function initElixirTrainer() {
      currentElixir = 10;
      playsCount = 0;
      // Bot will play randomly between 3 and 7 cards before stopping
      targetStopPlays = Math.floor(Math.random() * 5) + 3; 

      updateElixirBar();

      // Smooth ticker: adds 0.1 Elixir every 280ms (equals 1 Elixir per 2.8 seconds)
      elixirTimer = setInterval(() => {
        if (currentElixir < 10) {
          currentElixir = Math.min(10, currentElixir + 0.1);
          updateElixirBar();
        }
      }, 280);

      // Start the bot's random plays
      const initialDelay = Math.floor(Math.random() * 1500) + 1000;
      botLoopTimer = setTimeout(triggerBotPlay, initialDelay);
    }

    function triggerBotPlay() {
      if (playsCount >= targetStopPlays) {
        clearInterval(elixirTimer);
        askElixirQuestion();
        return;
      }

      // Filter cards the bot can actually afford right now
      const playable = hand.filter(c => c.cost <= currentElixir);

      if (playable.length > 0) {
        // Randomly select ANY affordable card, not just the highest one
        const selectedCard = playable[Math.floor(Math.random() * playable.length)];
        
        currentElixir -= selectedCard.cost;
        updateElixirBar();
        displayPlayedCard(selectedCard);

        // Standard 4-card cycle mechanic
        hand = hand.filter(c => c.id !== selectedCard.id);
        const drawnCard = queue.shift();
        hand.push(drawnCard);
        queue.push(selectedCard);

        playsCount++;
      }

      // Humanized random delay between 2 and 4.5 seconds
      const nextDelay = Math.floor(Math.random() * 2500) + 2000;
      botLoopTimer = setTimeout(triggerBotPlay, nextDelay);
    }

    function askElixirQuestion() {
      document.getElementById('status-badge').innerText = "STOP! GUESS ELIXIR";
      document.getElementById('question-title').innerText = "How much Elixir does the opponent have?";
      
      // Real players only track whole numbers
      correctAns = Math.floor(currentElixir);
      
      let options = new Set([correctAns]);
      while (options.size < 4) {
        let fake = Math.max(0, Math.min(10, correctAns + (Math.floor(Math.random() * 5) - 2)));
        options.add(fake);
      }

      renderTextOptions(Array.from(options).sort((a, b) => a - b), (selected) => {
        showFeedback(selected === correctAns, `They had ${correctAns} Elixir.`);
      });
    }

    // --- CARD CYCLE LOGIC ---
    function initCardCycleTrainer() {
      let totalCycles = Math.floor(Math.random() * 3) + 3; // 3 to 5 card plays
      let playedSequence = [];

      for (let i = 0; i < totalCycles; i++) {
        const playedCard = hand[Math.floor(Math.random() * hand.length)];
        playedSequence.push(playedCard);

        hand = hand.filter(c => c.id !== playedCard.id);
        const drawnCard = queue.shift();
        hand.push(drawnCard);
        queue.push(playedCard);
      }

      let seqIndex = 0;
      const playInterval = setInterval(() => {
        if (seqIndex >= playedSequence.length) {
          clearInterval(playInterval);
          askCardCycleQuestion();
          return;
        }
        displayPlayedCard(playedSequence[seqIndex]);
        seqIndex++;
      }, 2000);
    }

    function askCardCycleQuestion() {
      document.getElementById('status-badge').innerText = "GUESS NEXT CARD";
      document.getElementById('question-title').innerText = "Which card is about to enter their hand?";

      const nextUp = queue[0];
      correctAns = nextUp.id;

      let options = [nextUp];
      let pool = deck.filter(c => c.id !== nextUp.id);
      
      while (options.length < 4) {
        let randCard = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        options.push(randCard);
      }
      options.sort(() => 0.5 - Math.random());

      renderImageOptions(options, (selectedId) => {
        showFeedback(selectedId === correctAns, `It was ${nextUp.name}.`);
      });
    }

    // --- RENDER LOGIC ---
    function updateElixirBar() {
      const pct = (currentElixir / 10) * 100;
      document.getElementById('elixir-bar').style.width = pct + '%';
    }

    function displayPlayedCard(card) {
      const slot = document.getElementById('played-card-slot');
      
      // Pulls image directly from the /cards folder
      document.getElementById('played-card-icon').src = `cards/${card.id}.png`;
      document.getElementById('played-card-cost').innerText = card.cost;
      
      slot.classList.remove('hidden');
      
      // Reset animation
      slot.style.animation = 'none';
      slot.offsetHeight; // Trigger reflow
      slot.style.animation = null;

      setTimeout(() => {
        slot.classList.add('hidden');
      }, 1500);
    }

    function renderTextOptions(arr, callback) {
      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';
      grid.classList.remove('hidden');

      arr.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "py-3 bg-yellow-500 hover:bg-yellow-400 text-black text-xl font-bold rounded-xl border-b-4 border-yellow-700 active:border-b-0 active:translate-y-1 shadow-md transition-all";
        btn.innerText = opt;
        btn.onclick = () => callback(opt);
        grid.appendChild(btn);
      });
    }

    function renderImageOptions(arr, callback) {
      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';
      grid.classList.remove('hidden');

      arr.forEach(card => {
        const btn = document.createElement('button');
        btn.className = "py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl border-b-4 border-slate-900 flex items-center justify-start px-2 gap-3 active:border-b-0 active:translate-y-1 transition-all overflow-hidden";
        // Shows the uploaded image inside the button
        btn.innerHTML = `<img src="cards/${card.id}.png" class="w-10 h-12 object-contain drop-shadow-md" /> <span class="text-sm font-bold tracking-wide">${card.name}</span>`;
        btn.onclick = () => callback(card.id);
        grid.appendChild(btn);
      });
    }

    function showFeedback(isCorrect, subtitle) {
      const overlay = document.getElementById('feedback-overlay');
      const text = document.getElementById('feedback-text');
      
      text.innerText = isCorrect ? "CORRECT!" : "WRONG!";
      text.className = isCorrect ? "text-4xl text-green-400 cr-text-stroke tracking-wide" : "text-4xl text-red-500 cr-text-stroke tracking-wide";
      
      document.getElementById('question-title').innerText = subtitle;
      overlay.classList.remove('hidden');
    }

    startTrainer();
  </script>
</body>
</html>
